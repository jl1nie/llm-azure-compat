model: claude-4.1
label:
  en_US: Anthropic Claude 4.1 Sonnet
model_type: llm
features:
  - vision
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    type: float
    min: 0
    max: 1
    default: 0.7

  - name: top_p
    use_template: top_p
    default: 1

  - name: max_tokens
    type: int
    min: 1
    max: 32000
    default: 32000

  - name: enable_vision
    type: boolean
    default: false

  - name: json_response
    type: boolean
    default: false

  - name: thinking
    type: boolean
    default: false
