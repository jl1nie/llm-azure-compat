model: gemini-2.5-flash
label:
  en_US: gemini-2.5-flash
model_type: llm
features:
  - vision
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 100000
parameter_rules:
  - name: temperature
    type: float
    min: 0
    max: 2
    default: 0.7
    
  - name: top_p
    use_template: top_p
    default: 1

  - name: max_tokens
    type: int
    min: 1
    max: 65535
    default: 65535

  - name: enable_vision
    type: boolean
    default: false

  - name: json_schema
    type: string
