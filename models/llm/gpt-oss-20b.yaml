model: openai/gpt-oss-20b
label:
  en_US: gpt-oss-20b
model_type: llm
features:
  - vision
  - tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
  - name: temperature
    type: float
    min: 0
    max: 2
    default: 0.7
    
  - name: top_p
    use_template: top_p
    default: 1

  - name: max_tokens
    type: int
    min: 1
    max: 8192
    default: 8192

  - name: enable_vision
    type: boolean
    default: false

  - name: thinking
    type: boolean
    default: false
